name: Prod smoke

# Runs after every push to main (the same event that triggers the Vercel
# deployment), waits for Vercel's status on the exact commit to report success,
# then smoke-tests the live app: boots, logs in, renders the exact seeded
# totals, and stays within the response-time budget.
#
# Steps are gated on HAS_PASSWORD because `secrets` is not valid in `if:` —
# only in `env:`, so the presence check happens there. Requires the canonical
# FAMILY_MASTER_PASSWORD secret (the prod login password); PROD_URL defaults
# to the canonical production app and can be overridden via secret.

on:
  push:
    branches: [main]

jobs:
  smoke:
    name: Smoke test deployed app
    runs-on: ubuntu-latest
    env:
      HAS_PASSWORD: ${{ secrets.FAMILY_MASTER_PASSWORD != '' }}
      PROD_URL: ${{ secrets.PROD_URL != '' && secrets.PROD_URL || 'https://kharchubook.vercel.app' }}
      FAMILY_MASTER_PASSWORD: ${{ secrets.FAMILY_MASTER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No FAMILY_MASTER_PASSWORD secret — skipping smoke
        if: ${{ env.HAS_PASSWORD != 'true' }}
        run: echo "::notice title=skipped::Set the FAMILY_MASTER_PASSWORD secret to enable the prod smoke test."
      - name: Wait for Vercel commit status
        if: ${{ env.HAS_PASSWORD == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/statuses" \
              --jq '[.[] | select(.context == "Vercel")] | first | .state // ""' 2>/dev/null || true)
            if [ "$state" = "success" ]; then
              echo "Vercel commit status is successful"
              exit 0
            fi
            if [ "$state" = "error" ] || [ "$state" = "failure" ]; then
              echo "Vercel commit status reported $state"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for Vercel commit status for ${{ github.sha }}"
          exit 1
      - name: Smoke test
        if: ${{ env.HAS_PASSWORD == 'true' }}
        env:
          FAMILY_MASTER_PASSWORD: ${{ secrets.FAMILY_MASTER_PASSWORD }}
        run: npm run smoke:prod
