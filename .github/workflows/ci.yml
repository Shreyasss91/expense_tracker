name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    env:
      # src/db constructs the neon client at module load, so `next build`
      # needs a non-empty DATABASE_URL even though every route is dynamic and
      # never queries at build time. Falls back to a placeholder when no CI
      # database secret is configured.
      DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # DB-backed invariants (seed round-trip + rename round-trip). Gated at the
  # step level because `secrets` is not available in job-level `if:`. Point
  # DATABASE_URL at a disposable Neon branch; both tests are self-healing
  # (the seed is idempotent and the rename test always reverts).
  db-tests:
    name: DB round-trip tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No CI database secret — skipping DB tests
        if: ${{ secrets.DATABASE_URL == '' }}
        run: echo "::notice title=skipped::Set the DATABASE_URL secret (a disposable Neon branch) to enable the DB round-trip tests."
      - name: Apply migrations
        if: ${{ secrets.DATABASE_URL != '' }}
        run: npm run db:migrate
      - name: Seed
        if: ${{ secrets.DATABASE_URL != '' }}
        run: npm run db:seed
      - name: Seed round-trip (export reproduces seed.csv)
        if: ${{ secrets.DATABASE_URL != '' }}
        run: npm run test:seed-roundtrip
      - name: Rename round-trip (rename propagates to history, reverts)
        if: ${{ secrets.DATABASE_URL != '' }}
        run: npm run test:rename-roundtrip
