name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    env:
      # src/db constructs the neon client at module load, so `next build`
      # needs a non-empty DATABASE_URL even though every route is dynamic and
      # never queries at build time. Falls back to a placeholder when no CI
      # database secret is configured.
      DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: CSV quoting (DB-free serializer regression)
        run: npm run test:csv-quoting
      - name: Ledger URL composition (DB-free filter regression)
        run: npm run test:ledger-url

  # DB-backed invariants (seed, rename, budget round-trip + semantics). Point
  # DATABASE_URL at a disposable Neon branch; the tests are self-healing
  # (the seed is idempotent, the rename test always reverts, and the budget
  # tests write to throwaway months and snapshot-restore real data). The steps
  # are gated on HAS_CI_DB because `secrets` is not valid in `if:` — only in
  # `env:`, so the presence check happens there.
  db-tests:
    name: DB round-trip tests
    runs-on: ubuntu-latest
    env:
      HAS_CI_DB: ${{ secrets.DATABASE_URL != '' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No CI database secret — skipping DB tests
        if: ${{ env.HAS_CI_DB != 'true' }}
        run: echo "::notice title=skipped::Set the DATABASE_URL secret (a disposable Neon branch) to enable the DB round-trip tests."
      - name: Apply migrations
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run db:migrate
      - name: Seed
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run db:seed
      - name: Seed round-trip (export reproduces seed.csv)
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run test:seed-roundtrip
      - name: Rename round-trip (rename propagates to history, reverts)
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run test:rename-roundtrip
      - name: Budget round-trip (scope replace + inline edit/clear persist)
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run test:budget-roundtrip
      - name: Budget semantics (exclude-bills math, precedence, bill chain)
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run test:budget-semantics
