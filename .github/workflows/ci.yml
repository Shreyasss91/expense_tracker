name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    env:
      # src/db constructs the neon client at module load, so `next build`
      # needs a non-empty DATABASE_URL even though every route is dynamic and
      # never queries at build time. Falls back to a placeholder when no CI
      # database secret is configured.
      DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Service worker JavaScript syntax
        run: node --check public/sw.js
      - run: npm run test:offline-queue
      - run: npm run test:transaction-identity
      - run: npm run test:recurring-identity
      - run: npm run test:import-dedup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: CSV quoting (DB-free serializer regression)
        run: npm run test:csv-quoting
      - name: CSV parser (DB-free import-side parser regression)
        run: npm run test:csv-parse
      - name: Live CSV parser (DB-free verification regression)
        run: npm run test:csv-parser
      # The live scripts log into PRODUCTION, so a stale exported secret silently
      # beating .env.local must stay a hard failure, and a missing argument must
      # reject before any request. Runs its own fixtures, sends no requests.
      - name: Live-script guardrails (DB-free, fixture-driven)
        run: npm run test:live
      - name: Export formats (DB-free CSV/JSON → import round-trip regression)
        run: npm run test:export-format
      - name: XLSX writer (DB-free OPC/ZIP package regression)
        run: npm run test:xlsx
      - name: Ledger URL composition (DB-free filter regression)
        run: npm run test:ledger-url
      - name: Semantic validation (DB-free date/time/month regression)
        run: npm run test:validation
      # §3.1 — a master-password change must retire the sessions it predates.
      # Sets its own AUTH_SECRET / FAMILY_MASTER_PASSWORD, so it needs no secret.
      - name: Master-password session revocation (DB-free auth callback regression)
        run: npm run test:password-session
      # A write-then-revalidate path must never report a committed write as a
      # failure. DB-free but not server-free: it imports the `server-only`
      # cache-refresh helper under the react-server condition, where the
      # framework's revalidatePath genuinely throws — the only way to exercise
      # the failure path. It also pins the import source of every call site.
      - name: Cache-refresh guard (a refresh failure is never a failed write)
        run: npm run test:cache-refresh
      # A cached read is only as fresh as its tag set, and Next cannot infer one:
      # a missing tag throws nothing, it just serves the pre-write answer until
      # the TTL. Pins each unstable_cache read against the tables it touches and
      # each route-handler write against the tag it must clear. DB-free.
      - name: Cache-tag guard (cached reads and route-handler writes)
        run: npm run test:cache-tags

  # §1.4 — the committed migration chain MUST replay from scratch on every
  # push: the 0004/0005 collision went unnoticed precisely because the only
  # migration step was silently skipped whenever the Neon secret was absent.
  # A disposable vanilla Postgres service container (no secret needed) applies
  # drizzle/0000…0016 in order; any collision or non-idempotent statement
  # fails the build. drizzle-kit migrate uses its own postgres driver, so a
  # plain local Postgres is a valid target (the app's neon-http seed/tests
  # cannot reach it, which is why the data checks stay in db-tests below).
  migrations:
    name: Migration chain replay (fresh Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply the full chain (0000 → 0016) on an empty database
        run: npm run db:migrate
      - name: Verify journal and SQL files stay 1:1
        run: node scripts/check-migrations.mjs

  # DB-backed data invariants (seed, hierarchy, categorize, rename, budget
  # round-trip + semantics) that run through the app's neon-http driver and
  # therefore need a Neon database. Point DATABASE_URL at a disposable Neon
  # branch; the tests are self-healing (the seed is idempotent, the rename
  # test always reverts, and the budget tests write to throwaway months and
  # snapshot-restore real data). Gated on HAS_CI_DB because `secrets` is not
  # valid in `if:` — only in `env:`, so the presence check happens there.
  # The migration chain itself is verified on EVERY push by the migrations
  # job above, secret or not.
  db-tests:
    name: DB round-trip tests (Neon branch)
    runs-on: ubuntu-latest
    env:
      HAS_CI_DB: ${{ secrets.DATABASE_URL != '' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No CI database secret — skipping Neon data tests
        if: ${{ env.HAS_CI_DB != 'true' }}
        run: echo "::notice title=skipped::Set the DATABASE_URL secret (a disposable Neon branch) to enable the Neon data round-trip tests. The migration chain itself is verified on every push by the migrations job."
      - name: Apply migrations
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run db:migrate
      - name: Seed
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run db:seed
      - name: Seed round-trip (export reproduces seed.csv)
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run test:seed-roundtrip
      - name: Category hierarchy invariants (two-level tree, assignability)
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run test:hierarchy
      - name: Categorize round-trip (bulk assign persists + reverts)
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run test:categorize-roundtrip
      - name: Rename round-trip (rename propagates to history, reverts)
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run test:rename-roundtrip
      - name: Budget round-trip (scope replace + inline edit/clear persist)
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run test:budget-roundtrip
      - name: Budget semantics (exclude-bills math, precedence, bill chain)
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run test:budget-semantics
      # §5.4.4 — the netting is assembled from activity_log, so only a real
      # getLedgerFeed can prove it nets deletions pairwise, on created_at. Runs
      # with --conditions=react-server to import the server-only module; see the
      # test's header.
      - name: Ledger-feed netting (real getLedgerFeed, pairwise deletions)
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run test:ledger-feed-netting
      # §5.4.4 — only the database can show that the row a restore writes really
      # carries the snapshot's created_at and reviewed_at, which is what the
      # feed selects on. See the test's header.
      - name: Restore round-trip (an Undo restores faithfully, timestamps included)
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run test:restore-roundtrip
      # §5.4.4 / §5.5.3 — the marker row is the gate the agent AND the 22:15
      # fallback both consult, so "a rejected key writes nothing" is only
      # provable against the real app_settings table. Drives the real route
      # handler; see the test's header.
      - name: digest/day POST (windowKey validation against app_settings)
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run test:digest-day-post
      # §2.12 — the daily auto-stamp is the only path that writes to the ledger
      # unattended, and every one of its guarantees (one stamp per template per
      # month, the marker that stops a second, the one-shot skip_month, paused
      # and variable templates) is a database fact. Drives the real route; picks
      # a day of month no real template uses so it can only match its fixtures.
      - name: Recurring cron (drives /api/cron/recurring against real templates)
        if: ${{ env.HAS_CI_DB == 'true' }}
        run: npm run test:recurring-cron
